<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" role="img" aria-label="Top view showing a 42 to 48 inch work aisle, a 42 inch island with 15 inch overhang, 24 inches per seat and 44 inches behind stools" font-family="Inter, system-ui, sans-serif" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" fill="#171614" font-weight="600">Island clearances: 42-48&quot; to work, 44&quot; to walk behind the stools</text><text x="24" y="50" font-size="11.5" fill="#6f695e">Top view of a wall run and an island with seating. Gold shows the space to keep clear.</text><rect x="40.0" y="80.0" width="432.0" height="60.0" fill="#f3efe6" stroke="#45413a"/><text x="256.0" y="113.6" font-size="11" fill="#6f695e" text-anchor="middle">Counter and base cabinets, 25&quot; deep</text><line x1="32.0" y1="80.0" x2="480.0" y2="80.0" stroke="#45413a" stroke-width="3"/><rect x="40.0" y="140.0" width="432.0" height="115.2" fill="#c39443" fill-opacity="0.08"/><text x="256.0" y="204.8" font-size="12" fill="#171614" font-weight="600" text-anchor="middle">Work aisle: 42&quot; for one cook, 48&quot; for two</text><rect x="140.8" y="255.2" width="230.4" height="64.8" fill="#f3efe6" stroke="#45413a"/><rect x="140.8" y="320.0" width="230.4" height="36.0" fill="#c39443" fill-opacity="0.25" stroke="#45413a" stroke-dasharray="4 3"/><text x="256.0" y="291.2" font-size="11" fill="#6f695e" text-anchor="middle">Island cabinets, 27&quot; deep</text><text x="256.0" y="344.0" font-size="11" fill="#171614" text-anchor="middle">15&quot; overhang for knees</text><circle cx="169.6" cy="372.8" r="15.400000000000004" fill="#ffffff" stroke="#45413a"/><circle cx="227.2" cy="372.8" r="15.400000000000004" fill="#ffffff" stroke="#45413a"/><circle cx="284.8" cy="372.8" r="15.400000000000004" fill="#ffffff" stroke="#45413a"/><circle cx="342.4" cy="372.8" r="15.400000000000004" fill="#ffffff" stroke="#45413a"/><rect x="40.0" y="356.0" width="432.0" height="105.6" fill="#