<svg xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif" viewBox="0 0 760 330" role="img" aria-label="A recessed TV sits nearly flush; a surface mount stands 1.5 to 3 inches off the wall" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" font-weight="600" fill="#171614">A recessed TV sits nearly flush; a surface mount stands 1.5-3&quot; off the wall</text><text x="24" y="50" font-size="11.5" fill="#6f695e">Side view, room on the right. Depths to scale, heights not.</text><g><text x="24" y="80" font-size="13" font-weight="600" fill="#171614">Recessed in a niche</text><path d="M60 96H200V120H160V256H200V280H60Z" fill="#f3efe6" stroke="#45413a" stroke-width="1.25"></path><line x1="200" x2="200" y1="120" y2="256" stroke="#c39443" stroke-width="1.5" stroke-dasharray="4 3"></line><path d="M120 200V280" fill="none" stroke="#6f695e" stroke-width="1.25" stroke-dasharray="3 3"></path><rect x="160" y="170" width="15" height="40" fill="#a19b8e"></rect><rect x="175" y="128" width="15" height="120" rx="2" fill="#171614" fill-opacity="0.75"></rect><text x="214" y="132" fill="#171614">TV face within 1&quot; of wall</text><text x="214" y="180" fill="#171614">Niche 3-4&quot; deep</text><text x="214" y="196" font-size="11.5" fill="#6f695e">5-6&quot;+ for tilt or full motion</text><text x="214" y="244" fill="#171614">1-2&quot; gap all round</text><text x="214" y="260" font-size="11.5" fill="#6f695e">for airflow and removal</text><text x="130" y="300" text-anchor="middle" font-size="11.5" fill="#6f695e">Framed bump-out wall</text><text x="130" y="316" text-anchor="middle" font-size="11.5" fill="#6f695e">cables run inside</text></g><line x1="380" x2="380" y1="70" y2="316" stroke="#c8c3b8"></line><g><text x="404" y="80" font-size="13" font-weight="600" fill="#171614">Surface-mounted</text><rect x="440" y="96" width="120" height="184" fill="#f3efe6" stroke="#45413a" stroke-width="1.25"></rect><rect x="540" y="176" width="20" height="28" fill="none" stroke="#45413a" stroke-width="1"></rect><path d="M550 204V280" fill="none" stroke="#6f695e" stroke-width="1.25" stroke-dasharray="3 3"></path><rect x="560" y="170" width="18" height="40" fill="#a19b8e"></rect><rect x="578" y="128" width="15" height="120" rx="2" fill="#171614" fill-opacity="0.75"></rect><line x1="560" x2="593" y1="262" y2="262" stroke="#c39443" stroke-width="1.5"></line><line x1="560" x2="560" y1="256" y2="268" stroke="#c39443" stroke-width="1.5"></line><line x1="593" x2="593" y1="256" y2="268" stroke="#c39443" stroke-width="1.5"></line><text x="608" y="132" fill="#171614">Stands 1.5-3&quot;</text><text x="608" y="148" font-size="11.5" fill="#6f695e">off the wall</text><text x="608" y="188" fill="#171614">Recessed TV box</text><text x="608" y="204" font-size="11.5" fill="#6f695e">hides plugs and cables</text><text x="608" y="244" fill="#171614">Any future TV fits</text><text x="500" y="300" text-anchor="middle" font-size="11.5" fill="#6f695e">Standard or bump-out wall</text><text x="500" y="316" text-anchor="middle" font-size="11.5" fill="#6f695e">cables run inside</text></g></svg>