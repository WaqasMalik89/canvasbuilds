<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Section through a walk-in shower showing stud, cement board, waterproof membrane, tile, sloped mortar bed and drain" font-family="Inter, system-ui, sans-serif" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" fill="#171614" font-weight="600">What goes behind the tile in a walk-in shower</text><text x="24" y="50" font-size="11.5" fill="#6f695e">Section through a shower wall and floor. Layer thicknesses exaggerated for clarity.</text><rect x="40" y="330" width="360" height="18" fill="#f3efe6" stroke="#45413a"/><text x="220" y="343" font-size="11" fill="#6f695e" text-anchor="middle">Subfloor</text><rect x="40" y="80" width="40" height="250" fill="#f3efe6" stroke="#45413a"/><text x="60" y="205" font-size="11" fill="#6f695e" text-anchor="middle" transform="rotate(-90 60 205)">Stud wall</text><rect x="80" y="80" width="12" height="250" fill="#d9d5cc" stroke="#45413a" stroke-width="0.8"/><rect x="92" y="80" width="5" height="220" fill="#c39443"/><rect x="97" y="80" width="12" height="220" fill="#ffffff" stroke="#45413a"/><line x1="97" y1="80" x2="109" y2="80" stroke="#c8c3b8"/><line x1="97" y1="116" x2="109" y2="116" stroke="#c8c3b8"/><line x1="97" y1="152" x2="109" y2="152" stroke="#c8c3b8"/><line x1="97" y1="188" x2="109" y2="188" stroke="#c8c3b8"/><line x1="97" y1="224" x2="109" y2="224" stroke="#c8c3b8"/><line x1="97" y1="260" x2="109" y2="260" stroke="#c8c3b8"/><line x1="97" y1="296" x2="109" y2="296" stroke="#c8c3b8"/><rect x="80" y="140" width="29" height="46" fill="#ffffff" stroke="#45413a"/><rect x="80" y="186" width="29" height="4" fill="#c39443"/><path d="M80 330 L80 300 L330 316 L330 330 Z" fill="#d9d5cc" stroke="#45413a" stroke-width="0.8"/><path d="M97 299 L330 315" stroke="#c39443" stroke-width="4" fill="none"/><path d="M109 294 L330 310" stroke="#ffffff" stroke-width="7" fill="none"/><path d="M109 290 L330 306" stroke="#45413a" stroke-width="0.8" fill="none"/><path d="M109 297 L330 313" stroke="#45413a" stroke-width="0.8" fill="none"/><rect x="330" y="308" width="30" height="22" fill="#a19b8e"/><rect x="337" y="330" width="16" height="24" fill="#a19b8e"/><line x1="388" y1="80" x2="388" y2="312" stroke="#7a9cb8" stroke-width="4"/><text x="388" y="72" font-size="11.5" fill="#6f695e" text-anchor="middle">Glass</text><path d="M150 258 q70 14 150 30" fill="none" stroke="#7a9cb8" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M300 288 l-8 -6 l1 9 z" fill="#7a9cb8"/><path d="M103 100 L415 96 H425" fill="none" stroke="#c8c3b8"/><text x="432" y="100" font-size="11.5" fill="#171614">Tile set in thinset over the membrane</text><path d="M86 124 L415 142 H425" fill="none" stroke="#c8c3b8"/><text x="432" y="146" font-size="11.5" fill="#171614">Cement board behind the shower</text><text x="432" y="161" font-size="11" fill="#6f695e">never drywall or green board</text><path d="M108 170 L415 192 H425" fill="none" stroke="#c8c3b8"/><text x="432" y="196" font-size="11.5" fill="#171614">Niche framed between studs, waterproofed</text><text x="432" y="211" font-size="11" fill="#6f695e">and sloped so water runs out</text><path d="M94 246 L415 242 H425" fill="none" stroke="#c8c3b8"/><text x="432" y="246" font-size="11.5" fill="#171614">Waterproof membrane on every wet wall</text><text x="432" y="261" font-size="11" fill="#6f695e">liquid or sheet, continuous into the drain</text><path d="M220 316 L415 292 H425" fill="none" stroke="#c8c3b8"/><text x="432" y="296" font-size="11.5" fill="#171614">Mortar bed sloped 1/4&quot; per foot to the drain</text><path d="M345 322 L415 326 H425" fill="none" stroke="#c8c3b8"/><text x="432" y="330" font-size="11.5" fill="#171614">Drain with a bonding flange</text><text x="432" y="345" font-size="11" fill="#6f695e">the membrane seals to it</text></svg>