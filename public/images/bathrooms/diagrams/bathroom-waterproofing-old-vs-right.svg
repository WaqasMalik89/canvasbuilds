<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" role="img" aria-label="Side by side: plastic sheet behind cement board lets water soak into the board; a membrane right behind the tile stops water" font-family="Inter, system-ui, sans-serif" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" fill="#171614" font-weight="600">Where the waterproofing goes</text><text x="24" y="50" font-size="11.5" fill="#6f695e">Cut through a shower wall. Tile and grout let water through, so the barrier has to sit right behind the tile.</text><rect x="60" y="80" width="40" height="220" fill="#f3efe6" stroke="#45413a"/><text x="80" y="190.0" font-size="11" fill="#6f695e" text-anchor="middle">Stud</text><rect x="100" y="80" width="4" height="220" fill="#a19b8e"/><rect x="104" y="80" width="18" height="220" fill="#d9d5cc" stroke="#45413a" stroke-width="0.8"/><circle cx="110" cy="100" r="2.4" fill="#7a9cb8"/><circle cx="116" cy="122" r="2.4" fill="#7a9cb8"/><circle cx="110" cy="144" r="2.4" fill="#7a9cb8"/><circle cx="116" cy="166" r="2.4" fill="#7a9cb8"/><circle cx="110" cy="188" r="2.4" fill="#7a9cb8"/><circle cx="116" cy="210" r="2.4" fill="#7a9cb8"/><circle cx="110" cy="232" r="2.4" fill="#7a9cb8"/><circle cx="116" cy="254" r="2.4" fill="#7a9cb8"/><circle cx="110" cy="276" r="2.4" fill="#7a9cb8"/><rect x="122" y="80" width="14" height="220" fill="#ffffff" stroke="#45413a"/><line x1="122" y1="80" x2="137" y2="80" stroke="#c8c3b8" stroke-width="2"/><line x1="122" y1="124" x2="137" y2="124" stroke="#c8c3b8" stroke-width="2"/><line x1="122" y1="168" x2="137" y2="168" stroke="#c8c3b8" stroke-width="2"/><line x1="122" y1="212" x2="137" y2="212" stroke="#c8c3b8" stroke-width="2"/><line x1="122" y1="256" x2="137" y2="256" stroke="#c8c3b8" stroke-width="2"/><path d="M210 172 L150 172" stroke="#7a9cb8" stroke-width="1.6" fill="none"/><path d="M146 172 l8 -4 v8 z" fill="#7a9cb8"/><path d="M210 208 L150 208" stroke="#7a9cb8" stroke-width="1.6" fill="none"/><path d="M146 208 l8 -4 v8 z" fill="#7a9cb8"/><path d="M210 244 L150 244" stroke="#7a9cb8" stroke-width="1.6" fill="none"/><path d="M146 244 l8 -4 v8 z" fill="#7a9cb8"/><path d="M210 280 L150 280" stroke="#7a9cb8" stroke-width="1.6" fill="none"/><path d="M146 280 l8 -4 v8 z" fill="#7a9cb8"/><rect x="420" y="80" width="40" height="220" fill="#f3efe6" stroke="#45413a"/><text x="440" y="190.0" font-size="11" fill="#6f695e" text-anchor="middle">Stud</text><rect x="460" y="80" width="18" height="220" fill="#d9d5cc" stroke="#45413a" stroke-width="0.8"/><rect x="478" y="80" width="5" height="220" fill="#c94c4c"/><rect x="483" y="80" width="14" height="220" fill="#ffffff" stroke="#45413a"/><line x1="483" y1="80" x2="497" y2="80" stroke="#c8c3b8" stroke-width="2"/><line x1="483" y1="124" x2="497" y2="124" stroke="#c8c3b8" stroke-width="2"/><line x1="483" y1="168" x2="497" y2="168" stroke="#c8c3b8" stroke-width="2"/><line x1="483" y1="212" x2="497" y2="212" stroke="#c8c3b8" stroke-width="2"/><line x1="483" y1="256" x2="497" y2="256" stroke="#c8c3b8" stroke-width="2"/><path d="M570 172 L510 172" stroke="#7a9cb8" stroke-width="1.6" fill="none"/><path d="M506 172 l8 -4 v8 z" fill="#7a9cb8"/><path d="M570 208 L510 208" stroke="#7a9cb8" stroke-width="1.6" fill="none"/><path d="M506 208 l8 -4 v8 z" fill="#7a9cb8"/><path d="M570 244 L510 244" stroke="#7a9cb8" stroke-width="1.6" fill="none"/><path d="M506 244 l8 -4 v8 z" fill="#7a9cb8"/><path d="M570 280 L510 280" stroke="#7a9cb8" stroke-width="1.6" fill="none"/><path d="M506 280 l8 -4 v8 z" fill="#7a9cb8"/><text x="60" y="336" font-size="13" fill="#d9622b" font-weight="600">The old way</text><text x="60" y="356" font-size="11.5" fill="#6f695e">Plastic sheet behind the board. Water</text><text x="60" y="371" font-size="11.5" fill="#6f695e">soaks through the grout into the board</text><text x="60" y="386" font-size="11.5" fill="#6f695e">and sits there.</text><text x="420" y="336" font-size="13" fill="#6b9e6b" font-weight="600">The right way</text><text x="420" y="356" font-size="11.5" fill="#6f695e">A membrane (red) right behind the tile.</text><text x="420" y="371" font-size="11.5" fill="#6f695e">Water stops before it reaches the</text><text x="420" y="386" font-size="11.5" fill="#6f695e">board and drains away.</text><text x="150" y="100" font-size="11.5" fill="#171614">Plastic sheet</text><line x1="104" y1="96" x2="146" y2="96" stroke="#c8c3b8"/><text x="150" y="130" font-size="11.5" fill="#171614">Cement board</text><line x1="115" y1="126" x2="146" y2="126" stroke="#c8c3b8"/><text x="510" y="100" font-size="11.5" fill="#171614">Membrane</text><line x1="480" y1="96" x2="506" y2="96" stroke="#c8c3b8"/><text x="510" y="130" font-size="11.5" fill="#171614">Tile</text><line x1="495" y1="126" x2="506" y2="126" stroke="#c8c3b8"/></svg>