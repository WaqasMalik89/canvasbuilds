<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img" aria-label="Top view of a bathroom showing 18 inches from the toilet centre to each side and 30 inches of clear space in front" font-family="Inter, system-ui, sans-serif" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" fill="#171614" font-weight="600">Plan the clearances first: 18&quot; each side of the toilet, 30&quot; clear in front</text><text x="24" y="50" font-size="11.5" fill="#6f695e">Top view of a typical 10 x 6 ft main bathroom. Gold dashes show our recommended clear space.</text><rect x="42.0" y="80.0" width="444.0" height="271.2" fill="#c8c3b8"/><rect x="48.0" y="86.0" width="432.0" height="259.2" fill="#ffffff"/><rect x="69.6" y="344.2" width="108.0" height="8" fill="#ffffff"/><line x1="69.6" y1="345.2" x2="69.6" y2="237.2" stroke="#45413a" stroke-width="1.5"/><path d="M69.6 237.2 A108.0 108.0 0 0 1 177.6 345.2" fill="none" stroke="#c8c3b8" stroke-dasharray="4 4"/><text x="123.6" y="367.2" font-size="11.5" fill="#6f695e" text-anchor="middle">Door</text><rect x="48.0" y="86.0" width="129.6" height="75.6" fill="#f3efe6" stroke="#45413a"/><rect x="80.4" y="104.0" width="64.8" height="39.6" rx="6" fill="#ffffff" stroke="#a19b8e"/><text x="112.8" y="156.4" font-size="11" fill="#171614" text-anchor="middle">36&quot; vanity</text><rect x="206.4" y="86.0" width="72.0" height="28.8" rx="3" fill="#f3efe6" stroke="#45413a"/><path d="M213.6 114.8 h57.6 v21.6 a28.8 50.4 0 0 1 -57.6 0 z" fill="#f3efe6" stroke="#45413a"/><line x1="242.4" y1="86.0" x2="242.4" y2="194.0" stroke="#45413a" stroke-dasharray="2 4"/><line x1="242.4" y1="266.0" x2="242.4" y2="309.2" stroke="#45413a" stroke-dasharray="2 4"/><rect x="188.4" y="186.8" width="108.0" height="108.0" fill="#c39443" fill-opacity="0.08" stroke="#c39443" stroke-dasharray="5 4" stroke-width="1.5"/><text x="242.4" y="237.2" font-size="11.5" fill="#171614" font-weight="600" text-anchor="middle">30&quot; x 30&quot; clear</text><text x="242.4" y="252.2" font-size="11" fill="#6f695e" text-anchor="middle">(21&quot; minimum)</text><rect x="307.2" y="86.0" width="172.8" height="129.6" fill="#7a9cb8" fill-opacity="0.12" stroke="#45413a"/><line x1="307.2" y1="215.6" x2="480.0" y2="215.6" stroke="#7a9cb8" stroke-width="3"/><circle cx="393.6" cy="150.8" r="5" fill="none" stroke="#45413a"/><text x="393.6" y="170.8" font-size="11.5" fill="#171614" text-anchor="middle">48&quot; x 36&quot; shower</text><text x="393.6" y="197.6" font-size="11" fill="#6f695e" text-anchor="middle">(36&quot; x 36&quot; or larger)</text><line x1="177.6" y1="323.6" x2="242.4" y2="323.6" stroke="#c39443" stroke-width="1.25"/><line x1="177.6" y1="318.6" x2="177.6" y2="328.6" stroke="#c39443" stroke-width="1.25"/><line x1="242.4" y1="318.6" x2="242.4" y2="328.6" stroke="#c39443" stroke-width="1.25"/><text x="210.0" y="317.6" font-size="11.5" fill="#171614" text-anchor="middle">18&quot;</text><line x1="242.4" y1="323.6" x2="307.2" y2="323.6" stroke="#c39443" stroke-width="1.25"/><line x1="242.4" y1="318.6" x2="242.4" y2="328.6" stroke="#c39443" stroke-width="1.25"/><line x1="307.2" y1="318.6" x2="307.2" y2="328.6" stroke="#c39443" stroke-width="1.25"/><text x="274.8" y="317.6" font-size="11.5" fill="#171614" text-anchor="middle">18&quot;</text><text x="242.4" y="341.6" font-size="11" fill="#6f695e" text-anchor="middle">toilet centre to vanity and shower (15&quot; minimum)</text><line x1="48.0" y1="70.0" x2="480.0" y2="70.0" stroke="#45413a" stroke-width="1.25"/><line x1="48.0" y1="65.0" x2="48.0" y2="75.0" stroke="#45413a" stroke-width="1.25"/><line x1="480.0" y1="65.0" x2="480.0" y2="75.0" stroke="#45413a" stroke-width="1.25"/><text x="264.0" y="64.0" font-size="11.5" fill="#171614" text-anchor="middle">10 ft (120&quot;)</text><rect x="500" y="100" width="10" height="10" fill="#c39443"/><text x="518" y="110" font-size="12.5" fill="#171614" font-weight="600">Toilet</text><text x="518" y="126" font-size="11.5" fill="#6f695e">18&quot; from its centre to any side wall,</text><text x="518" y="141" font-size="11.5" fill="#6f695e">vanity or shower (15&quot; minimum)</text><rect x="500" y="152" width="10" height="10" fill="#c39443"/><text x="518" y="162" font-size="12.5" fill="#171614" font-weight="600">In front of toilet</text><text x="518" y="178" font-size="11.5" fill="#6f695e">30&quot; clear (21&quot; minimum)</text><rect x="500" y="204" width="10" height="10" fill="#c39443"/><text x="518" y="214" font-size="12.5" fill="#171614" font-weight="600">In front of vanity</text><text x="518" y="230" font-size="11.5" fill="#6f695e">30&quot; clear (21&quot; minimum)</text><rect x="500" y="256" width="10" height="10" fill="#7a9cb8"/><text x="518" y="266" font-size="12.5" fill="#171614" font-weight="600">Shower</text><text x="518" y="282" font-size="11.5" fill="#6f695e">36&quot; x 36&quot; or larger</text><text x="518" y="297" font-size="11.5" fill="#6f695e">(30&quot; x 30&quot; minimum)</text><rect x="500" y="308" width="10" height="10" fill="#c8c3b8"/><text x="518" y="318" font-size="12.5" fill="#171614" font-weight="600">Doorway</text><text x="518" y="334" font-size="11.5" fill="#6f695e">32&quot; door if space allows;</text><text x="518" y="349" font-size="11.5" fill="#6f695e">swing it clear of the toilet</text><text x="500" y="376" font-size="11" fill="#6f695e">Minimums follow common industry</text><text x="500" y="391" font-size="11" fill="#6f695e">guidelines; we confirm your local code.</text></svg>