<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-label="Top views of a round centre drain, a square centre drain and a linear drain, with the floor slope shown by arrows" font-family="Inter, system-ui, sans-serif" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" fill="#171614" font-weight="600">Three kinds of shower drain</text><text x="24" y="50" font-size="11.5" fill="#6f695e">Top view of a shower floor. Arrows show which way the floor slopes.</text><rect x="40" y="74" width="170" height="170" fill="#7a9cb8" fill-opacity="0.08" stroke="#45413a" stroke-width="1.5"/><line x1="40" y1="74" x2="210" y2="244" stroke="#c8c3b8" stroke-dasharray="4 4"/><line x1="210" y1="74" x2="40" y2="244" stroke="#c8c3b8" stroke-dasharray="4 4"/><line x1="125.0" y1="88" x2="125.0" y2="139.0" stroke="#7a9cb8" stroke-width="1.6"/><path d="M125.0 139.0 L121.6 132.9 L128.4 132.9 Z" fill="#7a9cb8"/><line x1="125.0" y1="230" x2="125.0" y2="179.0" stroke="#7a9cb8" stroke-width="1.6"/><path d="M125.0 179.0 L128.4 185.1 L121.6 185.1 Z" fill="#7a9cb8"/><line x1="54" y1="159.0" x2="105.0" y2="159.0" stroke="#7a9cb8" stroke-width="1.6"/><path d="M105.0 159.0 L98.9 162.4 L98.9 155.6 Z" fill="#7a9cb8"/><line x1="196" y1="159.0" x2="145.0" y2="159.0" stroke="#7a9cb8" stroke-width="1.6"/><path d="M145.0 159.0 L151.1 155.6 L151.1 162.4 Z" fill="#7a9cb8"/><circle cx="125.0" cy="159.0" r="12" fill="#ffffff" stroke="#45413a" stroke-width="1.5"/><circle cx="121.0" cy="155.0" r="1.6" fill="#45413a"/><circle cx="121.0" cy="159.0" r="1.6" fill="#45413a"/><circle cx="121.0" cy="163.0" r="1.6" fill="#45413a"/><circle cx="125.0" cy="155.0" r="1.6" fill="#45413a"/><circle cx="125.0" cy="159.0" r="1.6" fill="#45413a"/><circle cx="125.0" cy="163.0" r="1.6" fill="#45413a"/><circle cx="129.0" cy="155.0" r="1.6" fill="#45413a"/><circle cx="129.0" cy="159.0" r="1.6" fill="#45413a"/><circle cx="129.0" cy="163.0" r="1.6" fill="#45413a"/><text x="40" y="270" font-size="13" fill="#171614" font-weight="600">Round centre drain</text><text x="40" y="288" font-size="11.5" fill="#6f695e">Standard and lowest cost.</text><text x="40" y="304" font-size="11.5" fill="#6f695e">Floor slopes from all four sides,</text><text x="40" y="320" font-size="11.5" fill="#6f695e">so it suits small mosaic tile.</text><rect x="280" y="74" width="170" height="170" fill="#7a9cb8" fill-opacity="0.08" stroke="#45413a" stroke-width="1.5"/><line x1="280" y1="74" x2="450" y2="244" stroke="#c8c3b8" stroke-dasharray="4 4"/><line x1="450" y1="74" x2="280" y2="244" stroke="#c8c3b8" stroke-dasharray="4 4"/><line x1="365.0" y1="88" x2="365.0" y2="139.0" stroke="#7a9cb8" stroke-width="1.6"/><path d="M365.0 139.0 L361.6 132.9 L368.4 132.9 Z" fill="#7a9cb8"/><line x1="365.0" y1="230" x2="365.0" y2="179.0" stroke="#7a9cb8" stroke-width="1.6"/><path d="M365.0 179.0 L368.4 185.1 L361.6 185.1 Z" fill="#7a9cb8"/><line x1="294" y1="159.0" x2="345.0" y2="159.0" stroke="#7a9cb8" stroke-width="1.6"/><path d="M345.0 159.0 L338.9 162.4 L338.9 155.6 Z" fill="#7a9cb8"/><line x1="436" y1="159.0" x2="385.0" y2="159.0" stroke="#7a9cb8" stroke-width="1.6"/><path d="M385.0 159.0 L391.1 155.6 L391.1 162.4 Z" fill="#7a9cb8"/><rect x="353.0" y="147.0" width="24" height="24" fill="#ffffff" stroke="#45413a" stroke-width="1.5"/><line x1="357.0" y1="153.0" x2="373.0" y2="153.0" stroke="#45413a"/><line x1="357.0" y1="157.0" x2="373.0" y2="157.0" stroke="#45413a"/><line x1="357.0" y1="161.0" x2="373.0" y2="161.0" stroke="#45413a"/><line x1="357.0" y1="165.0" x2="373.0" y2="165.0" stroke="#45413a"/><text x="280" y="270" font-size="13" fill="#171614" font-weight="600">Square centre drain</text><text x="280" y="288" font-size="11.5" fill="#6f695e">A cleaner, modern look.</text><text x="280" y="304" font-size="11.5" fill="#6f695e">Same four-way slope; some models</text><text x="280" y="320" font-size="11.5" fill="#6f695e">take a tile insert to hide it.</text><rect x="520" y="74" width="170" height="170" fill="#7a9cb8" fill-opacity="0.08" stroke="#45413a" stroke-width="1.5"/><rect x="530" y="82" width="150" height="10" rx="2" fill="#ffffff" stroke="#45413a" stroke-width="1.5"/><line x1="536" y1="87" x2="674" y2="87" stroke="#45413a"/><line x1="550" y1="232" x2="550" y2="102" stroke="#7a9cb8" stroke-width="1.6"/><path d="M550 102 L553.4 108.1 L546.6 108.1 Z" fill="#7a9cb8"/><line x1="587" y1="232" x2="587" y2="102" stroke="#7a9cb8" stroke-width="1.6"/><path d="M587 102 L590.4 108.1 L583.6 108.1 Z" fill="#7a9cb8"/><line x1="624" y1="232" x2="624" y2="102" stroke="#7a9cb8" stroke-width="1.6"/><path d="M624 102 L627.4 108.1 L620.6 108.1 Z" fill="#7a9cb8"/><line x1="661" y1="232" x2="661" y2="102" stroke="#7a9cb8" stroke-width="1.6"/><path d="M661 102 L664.4 108.1 L657.6 108.1 Z" fill="#7a9cb8"/><text x="520" y="270" font-size="13" fill="#171614" font-weight="600">Linear drain</text><text x="520" y="288" font-size="11.5" fill="#6f695e">A long, narrow drain at one wall.</text><text x="520" y="304" font-size="11.5" fill="#6f695e">Floor slopes one way only, so large</text><text x="520" y="320" font-size="11.5" fill="#6f695e">tiles fit. Needed for curbless.</text></svg>