<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-label="Bar chart comparing typical bathroom exhaust fans by airflow in CFM and noise in sones" font-family="Inter, system-ui, sans-serif" font-size="12"><rect width="100%" height="100%" fill="#ffffff"/><text x="24" y="30" font-size="15" fill="#171614" font-weight="600">Exhaust fans: airflow vs noise</text><text x="24" y="50" font-size="11.5" fill="#6f695e">Typical ratings. Higher CFM moves more steam; lower sones means quieter.</text><text x="210" y="86" font-size="12" fill="#171614" font-weight="600">Airflow (CFM)</text><text x="470" y="86" font-size="12" fill="#171614" font-weight="600">Noise (sones) — shorter is quieter</text><text x="24" y="124" font-size="12.5" fill="#171614" font-weight="600">Basic builder fan</text><rect x="210" y="110" width="83.33" height="20" fill="#7a9cb8" fill-opacity="0.6"/><text x="301.33" y="125" font-size="12" fill="#171614">50 CFM</text><rect x="470" y="110" width="178.12" height="20" fill="#d9622b" fill-opacity="0.75"/><text x="656.12" y="125" font-size="12" fill="#171614">3.0 sones</text><text x="24" y="182" font-size="12.5" fill="#171614" font-weight="600">Quiet fan</text><rect x="210" y="168" width="133.33" height="20" fill="#7a9cb8" fill-opacity="0.6"/><text x="351.33" y="183" font-size="12" fill="#171614">80 CFM</text><rect x="470" y="168" width="47.5" height="20" fill="#c39443" fill-opacity="0.75"/><text x="525.5" y="183" font-size="12" fill="#171614">0.8 sones</text><text x="24" y="240" font-size="12.5" fill="#171614" font-weight="600">Quiet fan, larger room</text><rect x="210" y="226" width="183.33" height="20" fill="#7a9cb8" fill-opacity="0.6"/><text x="401.33" y="241" font-size="12" fill="#171614">110 CFM</text><rect x="470" y="226" width="59.38" height="20" fill="#c39443" fill-opacity="0.75"/><text x="537.38" y="241" font-size="12" fill="#171614">1.0 sones</text><text x="24" y="298" font-size="12.5" fill="#171614" font-weight="600">Ultra-quiet fan</text><rect x="210" y="284" width="133.33" height="20" fill="#7a9cb8" fill-opacity="0.6"/><text x="351.33" y="299" font-size="12" fill="#171614">80 CFM</text><rect x="470" y="284" width="17.81" height="20" fill="#6b9e6b" fill-opacity="0.75"/><text x="495.81" y="299" font-size="12" fill="#171614">0.3 sones</text><line x1="210" y1="96" x2="210" y2="340" stroke="#c8c3b8"/><line x1="470" y1="96" x2="470" y2="340" stroke="#c8c3b8"/><text x="24" y="360" font-size="11.5" fill="#6f695e">About 1 sone is a quiet fridge hum; 3–4 sones is a loud rattle you hear from the hallway.</text></svg>